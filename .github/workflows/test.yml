name: Run tests & Analyse code

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Enviroment
        run: cp .env.example .env

      # buildx is required for the GitHub Actions cache backend used below
      - uses: docker/setup-buildx-action@v3
      - name: Builds the stack
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          # must match the web service image in docker-compose.yml, so compose doesn't rebuild it
          tags: forenings_medlemmer-web:latest
          # use GitHub Action container image cache
          cache-from: type=gha
          # mode=max stores all intermediate layers (apt, npm, poetry), not just the final image
          cache-to: type=gha,mode=max
      - name: Check formatting (Black)
        run: docker compose run web black --check .
      - name: Static error check (Flake8)
        run: docker compose run web flake8
      - name: Test
        run: docker compose run web ./manage.py test
      - uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: selenium-screens
          path: ./test-screens
      - name: Create and upload UML diagram
        run: mkdir -p UML && docker compose run web ./manage.py graph_models members -o UML/UML_diagram.png
      - uses: actions/upload-artifact@v4.4.0
        with:
          name: UML_diagram.png
          path: UML
